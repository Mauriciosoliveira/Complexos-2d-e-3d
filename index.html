<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Plano Interativo - Adicionar e Remover Objetos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .controles {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f0f0f0;
    }
    button:hover {
      background-color: #e0e0e0;
    }
    button.btn-danger {
      background-color: #ff4d4d;
      color: white;
      border: none;
    }
    button.btn-danger:hover {
      background-color: #cc0000;
    }
    /* Área do Plano */
    #plano {
      width: 800px;
      height: 500px;
      border: 2px dashed #888;
      background-color: #fafafa;
      position: relative;
      overflow: hidden;
    }
    /* Estilo dos objetos no plano */
    .objeto {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      user-select: none;
      cursor: move;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .objeto.mesa {
      width: 100px;
      height: 60px;
      background-color: #4A90E2;
    }
    .objeto.cadeira {
      width: 40px;
      height: 40px;
      background-color: #50E3C2;
      color: #333;
    }
    /* Objeto selecionado */
    .objeto.selecionado {
      outline: 3px solid #ff9900;
    }
  </style>
</head>
<body>

  <h2>Plano Interativo</h2>

  <div class="controles">
    <button onclick="adicionarObjeto('mesa')">+ Adicionar Mesa</button>
    <button onclick="adicionarObjeto('cadeira')">+ Adicionar Cadeira</button>
    <button class="btn-danger" onclick="removerSelecionado()">- Remover Selecionado</button>
    <button onclick="limparPlano()">Limpar Tudo</button>
  </div>

  <div id="plano"></div>

  <script>
    const plano = document.getElementById('plano');
    let objetoSelecionado = null;
    let contador = 0;

    // Função para adicionar objetos ao plano
    function adicionarObjeto(tipo) {
      contador++;
      const el = document.createElement('div');
      el.classList.add('objeto', tipo);
      el.innerText = `${tipo.toUpperCase()} ${contador}`;
      
      // Posição inicial no centro do plano
      el.style.left = '50px';
      el.style.top = '50px';

      // Evento de seleção
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selecionarObjeto(el);
      });

      // Tornar o objeto arrastável
      tornarArrastavel(el);

      plano.appendChild(el);
      selecionarObjeto(el);
    }

    // Função para selecionar um objeto
    function selecionarObjeto(el) {
      if (objetoSelecionado) {
        objetoSelecionado.classList.remove('selecionado');
      }
      objetoSelecionado = el;
      objetoSelecionado.classList.add('selecionado');
    }

    // Desselecionar ao clicar no fundo do plano
    plano.addEventListener('click', () => {
      if (objetoSelecionado) {
        objetoSelecionado.classList.remove('selecionado');
        objetoSelecionado = null;
      }
    });

    // Função para remover o objeto selecionado
    function removerSelecionado() {
      if (objetoSelecionado) {
        plano.removeChild(objetoSelecionado);
        objetoSelecionado = null;
      } else {
        alert('Selecione um objeto no plano para remover!');
      }
    }

    // Limpar todo o plano
    function limparPlano() {
      plano.innerHTML = '';
      objetoSelecionado = null;
    }

    // Lógica para arrastar os elementos
    function tornarArrastavel(el) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

      el.onmousedown = function(e) {
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;

        document.onmousemove = function(e) {
          e.preventDefault();
          posX = mouseX - e.clientX;
          posY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;

          el.style.top = (el.offsetTop - posY) + "px";
          el.style.left = (el.offsetLeft - posX) + "px";
        };

        document.onmouseup = function() {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    }
  </script>
</body>
</html>
